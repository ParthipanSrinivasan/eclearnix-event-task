# Optional: a local MongoDB for development.
# Start it with `docker compose up -d`, then set in server/.env:
#   MONGO_URI=mongodb://127.0.0.1:27017/event-management
services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
